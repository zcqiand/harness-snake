# harness-snake 容器内 nginx 静态服务配置（单页应用，无路由回退需求也保持 try_files 兜底）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带指纹（vite 产物 assets/），可长缓存；HTML 不缓存保证发版即生效
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
